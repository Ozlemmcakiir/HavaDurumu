# Gökyüzü — Minikube / Helm eğitim değerleri
# Değiştirip `helm upgrade --install bilgeadam charts/havadurumu` yeter.

# Kaç pod çalışacak. Stajyer ölçekleme denemesi için 3 yapın.
replicaCount: 2

# minikube image build -t havadurumu:0.1.0 . ile kümenin içine konur.
# Registry yok; bu yüzden pullPolicy: Never.
image:
  repository: havadurumu
  tag: "0.1.0"
  pullPolicy: Never

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

# Pod'lara sabit kapı. Dışarıdan tarayıcı nginx Ingress üzerinden gelir.
service:
  type: NodePort
  port: 8000
  nodePort: 30080

# Flet web sunucusu. ConfigMap'e yazılır, pod buradan okur.
env:
  FLET_FORCE_WEB_SERVER: "true"
  FLET_SERVER_IP: "0.0.0.0"
  FLET_SERVER_PORT: "8000"

# Demo yayın: satın alınmış domain / A kaydı yok.
# localtest.me = laptop (127.0.0.1). catchAll = aynı Wi-Fi'deki telefon IP ile girer.
# Akış: tarayıcı → nginx Ingress → Service → Flet pod.
ingress:
  enabled: true
  className: nginx
  host: havadurumu.localtest.me
  catchAll: true
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL