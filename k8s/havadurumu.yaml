# Ilk deneme: duz Kubernetes YAML (Helm oncesi).
# Asil kurulum yolu: charts/havadurumu + scripts/deploy.ps1
# Bu dosyayi yalnizca Helm'siz denemek icin kullanin:
#   kubectl apply -f k8s/havadurumu.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: havadurumu
  labels:
    app: havadurumu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: havadurumu
  template:
    metadata:
      labels:
        app: havadurumu
    spec:
      containers:
        - name: havadurumu
          image: havadurumu:0.1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: FLET_FORCE_WEB_SERVER
              value: "true"
            - name: FLET_SERVER_IP
              value: "0.0.0.0"
            - name: FLET_SERVER_PORT
              value: "8000"
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 8
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 25
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: havadurumu
spec:
  type: NodePort
  selector:
    app: havadurumu
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30080
 